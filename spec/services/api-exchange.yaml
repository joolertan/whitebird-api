openapi: 3.1.0
info:
  title: Exchange API (gateway)
  version: '1'
  description: |
    Client exchange (buy/sell/convert crypto), custodial balance (deposits, withdrawals,
    operations history) and payment-method lookups served by the API gateway under
    `/api/v2/exchange` and `/api/v3/exchange`. Reconstructed from the whitebird.io web app.

    Errors are answered as `{"code": int, "status": "MACHINE_CODE", "message": str,
    "fields": [{"fieldName": str, "fieldValue": str}]}`. Limit errors
    (`INVALID_MIN_LIMIT`, `INVALID_MAX_LIMIT`) carry the limit in the `limit` field and the asset
    in the `asset` field.
x-wb-service: api
servers:
- url: https://api.whitebird.io
paths:
  /api/v3/exchange/client/quote:
    post:
      operationId: exchangeQuotesCreate
      x-wb-resource: exchange.quotes
      x-wb-name: create
      x-wb-status: experimental
      x-wb-source: bundle
      summary: Request an exchange quote
      description: |
        Prices a conversion between two legs. Each leg is an `INTERNAL_BALANCE` (Whitebird
        electronic wallet), a `CRYPTO_TRANSFER` (external crypto address) or a `FIAT_PROVIDER`
        (bank card / bank account of a payment provider). Set the amount on exactly one leg; the
        other one is computed. The quote `id` is then passed to `exchange.orders.create`.
        The web app re-requests the quote every 15 s while the form is open.

        Errors: `EXCHANGE_UNAVAILABLE`, `INVALID_MIN_LIMIT`, `INVALID_MAX_LIMIT`,
        `AMOUNT_TOO_SMALL`, `INVALID_ADDRESS`, `DESTINATION_ADDRESS_IS_INTERNAL`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExchangeQuoteRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExchangeQuote'
  /api/v3/exchange/client/limit:
    post:
      operationId: exchangeLimitsGet
      x-wb-resource: exchange.limits
      x-wb-name: get
      x-wb-status: experimental
      x-wb-source: bundle
      summary: Get exchange limits for a direction
      description: |
        Returns the minimum and maximum amounts for both legs of a direction. The web app calls it
        before quoting and before creating an internal conversion order. Answers
        `INVALID_MAX_LIMIT` when the client has exhausted its limits.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExchangeLimitsRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExchangeLimits'
  /api/v3/exchange/client/order:
    post:
      operationId: exchangeOrdersCreate
      x-wb-resource: exchange.orders
      x-wb-name: create
      x-wb-status: experimental
      x-wb-source: bundle
      summary: Create an order from a quote
      description: |
        Accepts a quote. For a `FIAT_PROVIDER` input the response carries the payment step:
        `input.link` (card acquiring page to redirect to; for Alfa-Bank the link carries
        `mdOrder` and 3-D Secure data is fetched from the Alfa service) or `postForm` (Assist:
        an HTML form to POST). For a `CRYPTO_TRANSFER` input `input.toAddress` is the Whitebird
        address to send the crypto to. Then poll `exchange.orders.get` until the status is
        `COMPLETED`, `FAILED` or `EXPIRED`.

        Errors: `QUOTE_NOT_FOUND` (quote expired, request a new one), `ACTIVE_ORDER_FOUND`,
        `ORDER_ALREADY_EXISTS`, `MAX_FIAT_CRYPTO_ORDERS_EXCEEDED`,
        `MAX_CRYPTO_FIAT_ORDERS_EXCEEDED`, `MAX_CA_FIAT_CRYPTO_ORDERS_EXCEEDED`,
        `INVALID_MFA_STATUS` (two-factor authentication must be enabled),
        `INVALID_INTERNAL_BALANCE`, `INVALID_FIAT_BALANCE`, `INVALID_CRYPTO_BALANCE`,
        `INVALID_CORPORATE_CARD`, `SINGLE_OP_MAX_VOLUME_EXCEEDED`,
        `OP_MAX_VOLUME_FOR_PERIOD_REACHED`, `OP_MAX_NUM_FOR_PERIOD_REACHED`,
        `IMPOSSIBLE_TO_COMPLETE_OPERATION_DUE_TO_INTERNAL_REASON` (anti-fraud),
        `EXCHANGE_UNAVAILABLE`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExchangeOrderRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExchangeOrder'
  /api/v3/exchange/client/order/{orderId}:
    get:
      operationId: exchangeOrdersGet
      x-wb-resource: exchange.orders
      x-wb-name: get
      x-wb-status: experimental
      x-wb-source: bundle
      summary: Get an order
      parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExchangeOrder'
  /api/v3/exchange/client/order/{orderId}/reject:
    post:
      operationId: exchangeOrdersReject
      x-wb-resource: exchange.orders
      x-wb-name: reject
      x-wb-status: experimental
      x-wb-source: bundle
      summary: Cancel an active order
      parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExchangeOrderRejectRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {}
  /api/v3/exchange/client/order/current:
    get:
      operationId: exchangeOrdersCurrent
      x-wb-resource: exchange.orders
      x-wb-name: current
      x-wb-status: experimental
      x-wb-source: bundle
      summary: Get the active order
      description: Returns the client's unfinished order for a destination, or an empty body when there is none.
      parameters:
      - name: destination
        in: query
        schema:
          $ref: '#/components/schemas/ExchangeDestination'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExchangeOrder'
  /api/v3/exchange/client/order/current/all:
    get:
      operationId: exchangeOrdersCurrentAll
      x-wb-resource: exchange.orders
      x-wb-name: current_all
      x-wb-status: experimental
      x-wb-source: bundle
      summary: List all active orders
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExchangeOrder'
  /api/v3/exchange/client/order/history:
    post:
      operationId: exchangeOrdersHistory
      x-wb-resource: exchange.orders
      x-wb-name: history
      x-wb-status: experimental
      x-wb-source: bundle
      summary: List finished and active orders
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      - $ref: '#/components/parameters/Sort'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExchangeOrderHistoryFilter'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExchangeOrderPage'
  /api/v2/exchange/client/assets:
    post:
      operationId: exchangeAssetsList
      x-wb-resource: exchange.assets
      x-wb-name: list
      x-wb-status: experimental
      x-wb-source: bundle
      summary: List assets available for a destination
      description: |
        Sent without a body. `merchantId` scopes the list to a merchant widget; the web app falls
        back to `11111111-1111-1111-1111-111111111111` when embedded without one.
      parameters:
      - name: destination
        in: query
        schema:
          $ref: '#/components/schemas/ExchangeDestination'
      - name: merchantId
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExchangeAssets'
  /api/v2/exchange/client/balance/current:
    get:
      operationId: balanceCurrent
      x-wb-resource: balance
      x-wb-name: current
      x-wb-status: experimental
      x-wb-source: bundle
      summary: List active deposits and withdrawals
      description: Unfinished balance operations, split into crypto and fiat ones.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceCurrentOperations'
  /api/v2/exchange/client/balance/crypto/deposit:
    post:
      operationId: balanceDepositsCreateCrypto
      x-wb-resource: balance.deposits
      x-wb-name: create_crypto
      x-wb-status: experimental
      x-wb-source: bundle
      summary: Start a crypto deposit
      description: |
        Returns the Whitebird address to send the crypto to (`depositCryptoAddress`). Errors:
        `ACTIVE_DEPOSIT_REQUEST_FOUND`, `ADDRESS_ALREADY_BOUND` (a pending operation already uses
        the network), `INVALID_CRYPTO_ADDRESS`, `EXCHANGE_UNAVAILABLE`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BalanceCryptoDepositRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceCryptoDeposit'
  /api/v2/exchange/client/balance/fiat/deposit:
    post:
      operationId: balanceDepositsCreateFiat
      x-wb-resource: balance.deposits
      x-wb-name: create_fiat
      x-wb-status: experimental
      x-wb-source: bundle
      summary: Start a fiat deposit
      description: |
        Returns the payment step: `fiatPaymentLink` / `paymentDetails.webPaymentLink` (card
        acquiring page), `paymentDetails.paymentLink` (bank app deep link, e.g. T-Bank QR) or
        `paymentDetails.postForm` (Assist). Current-account (`CA`) deposits are paid by invoice
        (see `current_account.invoices`). Errors: `ACTIVE_DEPOSIT_REQUEST_FOUND`,
        `ACTIVE_BALANCE_OPERATION_FOUND`, `INVALID_CORPORATE_CARD`, `INVALID_MIN_LIMIT`,
        `INVALID_MAX_LIMIT`, `AMOUNT_TOO_SMALL`, `EXCHANGE_UNAVAILABLE`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BalanceFiatDepositRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceFiatDeposit'
  /api/v2/exchange/client/balance/crypto/deposit/calculate:
    post:
      operationId: balanceDepositsCalculateCrypto
      x-wb-resource: balance.deposits
      x-wb-name: calculate_crypto
      x-wb-status: experimental
      x-wb-source: bundle
      summary: Calculate commission of a crypto deposit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BalanceCryptoCalculationRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceCalculation'
  /api/v2/exchange/client/balance/fiat/deposit/calculate:
    post:
      operationId: balanceDepositsCalculateFiat
      x-wb-resource: balance.deposits
      x-wb-name: calculate_fiat
      x-wb-status: experimental
      x-wb-source: bundle
      summary: Calculate commission of a fiat deposit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BalanceFiatCalculationRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceCalculation'
  /api/v2/exchange/client/balance/crypto/withdrawal:
    post:
      operationId: balanceWithdrawalsCreateCrypto
      x-wb-resource: balance.withdrawals
      x-wb-name: create_crypto
      x-wb-auth: mfa
      x-wb-mfa-operation: WITHDRAWAL
      x-wb-status: experimental
      x-wb-source: bundle
      summary: Withdraw crypto to an external address
      description: |
        Executes a calculation made with `balance.withdrawals.calculate_crypto` (address, amount
        and network are taken from it). Needs an operation MFA token for `WITHDRAWAL`; without it
        the service answers "Operation denied, requires mfa checking". Errors:
        `INVALID_CALCULATION` (calculation expired, calculate again),
        `ACTIVE_WITHDRAWAL_REQUEST_FOUND`, `ACTIVE_BALANCE_OPERATION_FOUND`, `INVALID_ADDRESS`,
        `DESTINATION_ADDRESS_IS_INTERNAL`, `INVALID_AMOUNT` (commission exceeds the amount),
        `INVALID_MIN_LIMIT`, `INVALID_MAX_LIMIT`, `INVALID_MFA_STATUS`, `INVALID_MFA_CODE`,
        `AML_FRAUD_VALIDATION_ERROR`, `BALANCE_OPERATION_PROCESSING_ERROR`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BalanceCryptoWithdrawalRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {}
  /api/v2/exchange/client/balance/fiat/withdrawal:
    post:
      operationId: balanceWithdrawalsCreateFiat
      x-wb-resource: balance.withdrawals
      x-wb-name: create_fiat
      x-wb-auth: mfa
      x-wb-mfa-operation: WITHDRAWAL
      x-wb-status: experimental
      x-wb-source: bundle
      summary: Withdraw fiat to a card or bank account
      description: |
        Needs an operation MFA token for `WITHDRAWAL`. `paymentToken` is the id of a bound card /
        payment method (`payments.methods.list`), or the QR ticket id for `MTS_QR` payments.
        `bankIdentifier` selects the recipient bank for SBP-style providers. Same errors as the
        crypto withdrawal.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BalanceFiatWithdrawalRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {}
  /api/v2/exchange/client/balance/crypto/withdrawal/calculate:
    post:
      operationId: balanceWithdrawalsCalculateCrypto
      x-wb-resource: balance.withdrawals
      x-wb-name: calculate_crypto
      x-wb-status: experimental
      x-wb-source: bundle
      summary: Calculate a crypto withdrawal
      description: Returns the commission, the received amount and a calculation `id` valid until `expirationDate`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BalanceCryptoCalculationRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceCalculation'
  /api/v2/exchange/client/balance/fiat/withdrawal/calculate:
    post:
      operationId: balanceWithdrawalsCalculateFiat
      x-wb-resource: balance.withdrawals
      x-wb-name: calculate_fiat
      x-wb-status: experimental
      x-wb-source: bundle
      summary: Calculate a fiat withdrawal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BalanceFiatCalculationRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceCalculation'
  /api/v2/exchange/client/balance/crypto/reject:
    post:
      operationId: balanceOperationsRejectCrypto
      x-wb-resource: balance.operations
      x-wb-name: reject_crypto
      x-wb-status: experimental
      x-wb-source: bundle
      summary: Cancel an active crypto deposit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BalanceRejectRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {}
  /api/v2/exchange/client/balance/fiat/reject:
    post:
      operationId: balanceOperationsRejectFiat
      x-wb-resource: balance.operations
      x-wb-name: reject_fiat
      x-wb-status: experimental
      x-wb-source: bundle
      summary: Cancel an active fiat deposit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BalanceRejectRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {}
  /api/v2/exchange/client/balance/operation:
    post:
      operationId: balanceOperationsList
      x-wb-resource: balance.operations
      x-wb-name: list
      x-wb-status: experimental
      x-wb-source: bundle
      summary: List deposits, withdrawals and referral rewards
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      - $ref: '#/components/parameters/Sort'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BalanceOperationFilter'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceOperationPage'
  /api/v2/exchange/referrer/reward/create:
    post:
      operationId: referralWithdraw
      x-wb-resource: referral
      x-wb-name: withdraw
      x-wb-status: experimental
      x-wb-source: bundle
      summary: Withdraw the referral balance to the wallet
      description: |
        Moves the whole `REFERRER_BALANCE` to the Whitebird wallet. Sent without a body; the client
        must be verified. Errors: `PHONE_NUMBER_REQUIRED`, `PHONE_CONFIRMATION_REQUIRED`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {}
  /api/v3/exchange/merchant/report:
    post:
      operationId: merchantDownloadReport
      x-wb-resource: merchant
      x-wb-name: download_report
      x-wb-response: binary
      x-wb-status: experimental
      x-wb-source: bundle
      summary: Export the merchant's client orders
      description: CSV (windows-1251) or PDF export of the orders made through the merchant widget.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MerchantReportRequest'
      responses:
        '200':
          description: CSV or PDF document
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
  /api/v2/exchange/client/payment/method:
    post:
      operationId: paymentsMethodsList
      x-wb-resource: payments.methods
      x-wb-name: list
      x-wb-status: experimental
      x-wb-source: bundle
      summary: List the client's payment methods
      description: |
        Bound cards, bank accounts and card-less methods usable for a direction. The web app sends
        either a direction (`fiatAsset` + `orderType` + `destination`, from the exchange and
        deposit/withdrawal forms) or a group (`countryGroup` `["BELARUS"]`, `["RUSSIA"]`,
        `["BELARUS","RUSSIA"]`, or `providers` `["CA"]` for current accounts) on the
        payment-methods page. A method's `id` is the `paymentToken` / `token` of deposits,
        withdrawals and quotes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentMethodsRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PaymentMethod'
  /api/v2/exchange/client/payment/provider:
    post:
      operationId: paymentsProvidersList
      x-wb-resource: payments.providers
      x-wb-name: list
      x-wb-status: experimental
      x-wb-source: bundle
      summary: List payment providers available for a destination
      description: Providers the client can pay with or add a method for; `destination` may be null (all).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentProvidersRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PaymentProvider'
  /api/v2/exchange/client/payment/card/limits:
    get:
      operationId: paymentsCardsLimits
      x-wb-resource: payments.cards
      x-wb-name: limits
      x-wb-status: experimental
      x-wb-source: bundle
      summary: Get card binding limits
      description: How many cards are bound in total and today, against the limits; binding is refused once either is reached.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentCardLimits'
components:
  parameters:
    Page:
      name: page
      in: query
      description: Zero-based page index.
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      description: Page size.
      schema:
        type: integer
        minimum: 1
        default: 20
    Sort:
      name: sort
      in: query
      description: Sort criteria in the format `property,(asc|desc)`; the web app uses `creationDate,desc`.
      schema:
        type: array
        items:
          type: string
  schemas:
    ExchangeDestination:
      type: string
      description: |
        Product context of a request. `EXCHANGE`: buy/sell with external card or address;
        `ACCOUNTING`: operations on the Whitebird wallet (internal conversion); `SDK_*`: the same
        contexts inside the embeddable widget (`SDK_CROSS`: wallet deposit/withdrawal assets,
        `SDK_SWAP`: swap assets).
      enum: [EXCHANGE, ACCOUNTING, SDK_EXCHANGE, SDK_ACCOUNTING, SDK_CROSS, SDK_SWAP]
    ExchangeLegType:
      type: string
      description: |
        `INTERNAL_BALANCE`: Whitebird wallet; `CRYPTO_TRANSFER`: external crypto address;
        `FIAT_PROVIDER`: card or bank account of a payment provider.
      enum: [FIAT_PROVIDER, CRYPTO_TRANSFER, INTERNAL_BALANCE]
    ExchangeOrderStatus:
      type: string
      enum: [NEW, PENDING, PROCESSING, COMPLETED, FAILED, EXPIRED, DECLINED]
    ExchangeLegStatus:
      type: string
      enum: [NEW, PROCESSING, UPDATED, COMPLETED, FAILED, EXPIRED]
    PaymentProviderType:
      type: string
      description: Payment provider / payment method family (same values as the brokerage `ProviderType`).
      enum: [ALFA, ASSIST, AZERICARD, BELVEB, BEPAID, BEPAID_CUSTOM, BGP, BRAZINO, BRICS, BSB, CA,
        CARUSELL, CORTI_MILLI, DSB, ERIP, INSNC, MAXLINE, MODULBANK, MTS, MTS_CASH, MTS_MULTITRANSFER,
        MTS_QR, SBER, SBP, SGB, SGB_CARD, STATUSBANK, TBANK, TEST, VTB, VTB_SBP, WILDBERRIES, ZUBRPARI]
    ExchangeQuoteLegRequest:
      type: object
      required: [asset, type]
      properties:
        asset:
          type: string
          description: Asset code; network-specific for crypto transfers (`USDT_TRC`, `USDC_SOL`, ...).
        type:
          $ref: '#/components/schemas/ExchangeLegType'
        amount:
          type: number
          format: decimal
          description: Set on the leg whose amount the client fixes (input or output, not both).
        provider:
          $ref: '#/components/schemas/PaymentProviderType'
        token:
          type: string
          description: Payment method id (bound card) of a `FIAT_PROVIDER` leg; the card number for `CORTI_MILLI`.
        toAddress:
          type: string
          description: External crypto address of a `CRYPTO_TRANSFER` output.
        comment:
          type: string
          description: Memo / destination tag of a `CRYPTO_TRANSFER` output.
    ExchangeQuoteRequest:
      type: object
      required: [input, output]
      properties:
        input:
          $ref: '#/components/schemas/ExchangeQuoteLegRequest'
        output:
          $ref: '#/components/schemas/ExchangeQuoteLegRequest'
        promoCode:
          type: string
        sessionId:
          type: string
          description: Widget session id (merchant SDK).
        merchantId:
          type: string
          description: Merchant id when quoting inside a merchant widget.
    ExchangeLeg:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/ExchangeLegType'
          x-wb-inferred: true
        asset:
          type: string
          x-wb-inferred: true
        amount:
          type: number
          format: decimal
          x-wb-inferred: true
        transactionAmount:
          type: number
          format: decimal
          description: Amount actually received or sent; differs from `amount` after a recalculation.
          x-wb-inferred: true
        feeAmount:
          type: number
          format: decimal
          description: Service commission on the fiat leg, network commission on the crypto leg.
          x-wb-inferred: true
        status:
          $ref: '#/components/schemas/ExchangeLegStatus'
          x-wb-inferred: true
        provider:
          $ref: '#/components/schemas/PaymentProviderType'
          x-wb-inferred: true
        token:
          type: string
          x-wb-inferred: true
        post:
          type: string
          description: Masked card / account number of a `FIAT_PROVIDER` leg.
          x-wb-inferred: true
        paymentSystem:
          type: string

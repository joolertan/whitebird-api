openapi: 3.1.0
info:
  title: Brokerage API
  version: '1.0'
x-wb-service: brokerage
servers:
- url: https://brokerage-service.whitebird.io
paths:
  /api/v1/brokerage/balance-order/crypto/deposit:
    post:
      summary: Create Crypto Deposit
      description: Create a crypto deposit balance order
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CryptoDepositRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceOrderResponse'
      operationId: brokerageBalanceOrdersCreateCryptoDeposit
      x-wb-resource: brokerage.balance_orders
      x-wb-name: create_crypto_deposit
      x-wb-source: openapi
      x-wb-first-seen: '2026-11-07'
  /api/v1/brokerage/balance-order/crypto/deposit/cancel:
    post:
      summary: Cancel Crypto Deposit
      description: Cancel a crypto deposit balance order
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CryptoDepositCancelRequest'
        required: true
      responses:
        '200':
          description: OK
      operationId: brokerageBalanceOrdersCancelCryptoDeposit
      x-wb-resource: brokerage.balance_orders
      x-wb-name: cancel_crypto_deposit
      x-wb-source: openapi
      x-wb-first-seen: '2026-11-07'
  /api/v1/brokerage/balance-order/crypto/withdrawal:
    post:
      summary: Create Crypto Withdrawal
      description: |
        Create a crypto withdrawal balance order. The order stays `AWAITING_CLIENT_CONFIRMATION`
        until the client confirms it with the token emailed to them (`confirm_crypto_withdrawal`);
        it then moves to `AWAITING_ADMIN_CONFIRMATION`.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CryptoWithdrawalRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceOrderResponse'
      operationId: brokerageBalanceOrdersCreateCryptoWithdrawal
      x-wb-resource: brokerage.balance_orders
      x-wb-name: create_crypto_withdrawal
      x-wb-source: openapi
      x-wb-first-seen: '2026-11-07'
  /api/v1/brokerage/balance-order/crypto/withdrawal/confirm/client:
    post:
      summary: Client confirms Crypto Withdrawal
      description: Client confirmation step for crypto withdrawal by token (public)
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientCryptoWithdrawalTokenRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceOrderResponse'
      operationId: brokerageBalanceOrdersConfirmCryptoWithdrawal
      x-wb-resource: brokerage.balance_orders
      x-wb-name: confirm_crypto_withdrawal
      x-wb-auth: none
      x-wb-source: openapi
      x-wb-first-seen: '2026-11-07'
  /api/v1/brokerage/balance-order/fiat/deposit:
    post:
      summary: Create Fiat Deposit
      description: Create a fiat deposit balance order
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FiatDepositRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceOrderResponse'
      operationId: brokerageBalanceOrdersCreateFiatDeposit
      x-wb-resource: brokerage.balance_orders
      x-wb-name: create_fiat_deposit
      x-wb-source: openapi
      x-wb-first-seen: '2026-11-07'
  /api/v1/brokerage/balance-order/fiat/withdrawal:
    post:
      summary: Create Fiat Withdrawal
      description: Create a fiat withdrawal balance order
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FiatWithdrawalRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceOrderResponse'
      operationId: brokerageBalanceOrdersCreateFiatWithdrawal
      x-wb-resource: brokerage.balance_orders
      x-wb-name: create_fiat_withdrawal
      x-wb-source: openapi
      x-wb-first-seen: '2026-11-07'
  /api/v1/brokerage/balance-order/page:
    post:
      summary: Get Balance Orders for current broker (paged)
      description: Get paginated balance orders filtered by fields
      parameters:
      - name: page
        in: query
        description: Zero-based page index.
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: size
        in: query
        description: Page size.
        schema:
          type: integer
          minimum: 1
          default: 20
      - name: sort
        in: query
        description: Sort criteria in the format `property,(asc|desc)`.
        schema:
          type: array
          items:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BalanceOrderFilterRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageBalanceOrderResponse'
      operationId: brokerageBalanceOrdersList
      x-wb-resource: brokerage.balance_orders
      x-wb-name: list
      x-wb-source: openapi
      x-wb-first-seen: '2026-11-07'
  /api/v1/brokerage/broker/balances:
    get:
      summary: Get Broker Balances
      description: Returns asset balances for the current broker
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: number
      operationId: brokerageBalances
      x-wb-resource: brokerage
      x-wb-name: balances
      x-wb-source: openapi
      x-wb-first-seen: '2026-11-07'
  /api/v1/brokerage/crypto-address:
    get:
      summary: My Crypto Addresses
      description: Get crypto addresses for the current user
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CryptoAddressResponse'
      operationId: brokerageCryptoAddressesList
      x-wb-resource: brokerage.crypto_addresses
      x-wb-name: list
      x-wb-source: openapi
      x-wb-first-seen: '2026-11-07'
    post:
      summary: Add Crypto Address
      description: |
        Add a crypto address for the current subaccount. Errors: 403 when the account has no
        two-factor authentication (the web app asks to enable it), 400 `INVALID_ADDRESS` or
        `MAX_NUMBER_REACHED`.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CryptoAddressRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CryptoAddressResponse'
      operationId: brokerageCryptoAddressesCreate
      x-wb-resource: brokerage.crypto_addresses
      x-wb-name: create
      x-wb-source: openapi
      x-wb-first-seen: '2026-11-07'
  /api/v1/brokerage/crypto-address/{addressId}:
    delete:
      summary: Delete Crypto Address
      description: Soft delete a crypto address for the current subaccount
      parameters:
      - name: addressId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
      operationId: brokerageCryptoAddressesDelete
      x-wb-resource: brokerage.crypto_addresses
      x-wb-name: delete
      x-wb-source: openapi
      x-wb-first-seen: '2026-11-07'
  /api/v1/brokerage/crypto-address/{subaccountId}/list:
    get:
      summary: Subaccount Crypto Addresses
      description: Get crypto addresses for a subaccount
      parameters:
      - name: subaccountId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CryptoAddressResponse'
      operationId: brokerageCryptoAddressesListForSubaccount
      x-wb-resource: brokerage.crypto_addresses
      x-wb-name: list_for_subaccount
      x-wb-source: openapi
      x-wb-first-seen: '2026-11-07'
  /api/v1/brokerage/orders/current/page:
    post:
      summary: Get Orders unified (paged)
      description: Get paginated unified orders for current broker filtered by fields
      parameters:
      - name: page
        in: query
        description: Zero-based page index.
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: size
        in: query
        description: Page size.
        schema:
          type: integer
          minimum: 1
          default: 20
      - name: sort
        in: query
        description: Sort criteria in the format `property,(asc|desc)`.
        schema:
          type: array
          items:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderUnifiedFilterRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageOrderUnifiedResponse'
      operationId: brokerageOrdersList
      x-wb-resource: brokerage.orders
      x-wb-name: list
      x-wb-source: openapi
      x-wb-first-seen: '2026-11-07'
  /api/v1/brokerage/orders/current/report:
    post:
      summary: Download Orders report (current broker)
      description: Generates an orders report for the current broker using the provided filters
      parameters:
      - name: fileType
        in: query
        required: true
        schema:
          type: string
          enum:
          - CSV
          - PDF
          - XLSX
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderUnifiedFilterRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: string
                format: byte
      operationId: brokerageOrdersDownloadReport
      x-wb-resource: brokerage.orders
      x-wb-name: download_report
      x-wb-source: openapi
      x-wb-first-seen: '2026-11-07'
      x-wb-response: binary
  /api/v1/brokerage/otc-order:
    post:
      summary: Create OTC Order
      description: Create a new OTC order
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtcOrderRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtcOrderResponse'
      operationId: brokerageOtcOrdersCreate
      x-wb-resource: brokerage.otc_orders
      x-wb-name: create
      x-wb-source: openapi
      x-wb-first-seen: '2026-11-07'
  /api/v1/brokerage/otc-order/calculate:
    post:
      summary: Calculate OTC Order
      description: Calculate OTC order for given exchange rate
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtcOrderCalculateRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtcOrderCalculateResponse'
      operationId: brokerageOtcOrdersCalculate
      x-wb-resource: brokerage.otc_orders
      x-wb-name: calculate
      x-wb-source: openapi
      x-wb-first-seen: '2026-11-07'
  /api/v1/brokerage/otc-order/confirm:
    post:
      summary: Process OTC Order
      description: Approve or reject an OTC order
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtcOrderConfirmRequest'
        required: true
      responses:
        '200':
          description: OK
      operationId: brokerageOtcOrdersConfirm
      x-wb-resource: brokerage.otc_orders
      x-wb-name: confirm
      x-wb-source: openapi
      x-wb-first-seen: '2026-11-07'
  /api/v1/brokerage/otc-order/page:
    post:
      summary: Get OTC Orders for current broker (paged)
      description: Get paginated OTC orders filtered by fields
      parameters:
      - name: page
        in: query
        description: Zero-based page index.
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: size
        in: query
        description: Page size.
        schema:
          type: integer
          minimum: 1
          default: 20
      - name: sort
        in: query
        description: Sort criteria in the format `property,(asc|desc)`.
        schema:
          type: array
          items:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtcOrderFilterRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageOtcOrderResponse'
      operationId: brokerageOtcOrdersList
      x-wb-resource: brokerage.otc_orders
      x-wb-name: list
      x-wb-source: openapi
      x-wb-first-seen: '2026-11-07'
  /api/v1/brokerage/payment/invoice/{balanceOrderId}/download-token:
    post:
      summary: Download invoice
      description: Generate token to download deposit invoice
      parameters:
      - name: balanceOrderId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DownloadTokenResponse'
      operationId: brokeragePaymentsInvoiceDownloadToken
      x-wb-resource: brokerage.payments
      x-wb-name: invoice_download_token
      x-wb-source: openapi
      x-wb-first-seen: '2026-11-07'
  /api/v1/brokerage/payment/methods:
    get:
      summary: Get payment methods
      description: Returns available payment methods
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PaymentMethodResponse'
      operationId: brokeragePaymentsMethods
      x-wb-resource: brokerage.payments
      x-wb-name: methods
      x-wb-source: openapi
      x-wb-first-seen: '2026-11-07'
  /api/v1/brokerage/subaccount/add/individual:
    post:
      summary: Add Subaccount (Individual)
      description: |
        Add an Individual subaccount for current broker. Errors: status `USER_EXISTS` (the email is
        taken), `SUBACCOUNT_EXISTS_BY_CUSTOM_ID` (the `customId` is taken), and per-field errors
        in `fields[]`.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubaccountIndividualRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubaccountResponse'
      operationId: brokerageSubaccountsCreateIndividual
      x-wb-resource: brokerage.subaccounts
      x-wb-name: create_individual
      x-wb-source: openapi
      x-wb-first-seen: '2026-11-07'
  /api/v1/brokerage/subaccount/add/individual-entrepreneur:
    post:
      summary: Add Subaccount (Individual Entrepreneur)
      description: |
        Add an Individual Entrepreneur subaccount for current broker. Errors: status `USER_EXISTS` (the email is
        taken), `SUBACCOUNT_EXISTS_BY_CUSTOM_ID` (the `customId` is taken), and per-field errors
        in `fields[]`.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubaccountIndividualEntrepreneurRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubaccountResponse'
      operationId: brokerageSubaccountsCreateIndividualEntrepreneur
      x-wb-resource: brokerage.subaccounts
      x-wb-name: create_individual_entrepreneur
      x-wb-source: openapi
      x-wb-first-seen: '2026-11-07'
  /api/v1/brokerage/subaccount/add/organization:
    post:
      summary: Add Subaccount (Organization)
      description: |
        Add an Organization subaccount for current broker. Errors: status `USER_EXISTS` (the email is
        taken), `SUBACCOUNT_EXISTS_BY_CUSTOM_ID` (the `customId` is taken), and per-field errors
        in `fields[]`.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubaccountOrganizationRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubaccountResponse'
      operationId: brokerageSubaccountsCreateOrganization
      x-wb-resource: brokerage.subaccounts
      x-wb-name: create_organization
      x-wb-source: openapi
      x-wb-first-seen: '2026-11-07'
  /api/v1/brokerage/subaccount/me:
    get:
      summary: My Subaccount
      description: Get subaccount info for the current user
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubaccountResponse'
      operationId: brokerageSubaccountsMe
      x-wb-resource: brokerage.subaccounts
      x-wb-name: me
      x-wb-source: openapi
      x-wb-first-seen: '2026-11-07'
  /api/v1/brokerage/subaccount/page:
    get:
      summary: Get Subaccounts (paged)
      description: Get paginated subaccounts for current broker
      parameters:
      - name: page
        in: query
        description: Zero-based page index.
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: size
        in: query
        description: Page size.
        schema:
          type: integer
          minimum: 1
          default: 20
      - name: sort
        in: query
        description: Sort criteria in the format `property,(asc|desc)`.
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageSubaccountResponse'
      operationId: brokerageSubaccountsList
      x-wb-resource: brokerage.subaccounts
      x-wb-name: list
      x-wb-source: openapi
      x-wb-first-seen: '2026-11-07'
  /api/v1/brokerage/subaccount/{id}:
    get:
      summary: Get Subaccount
      description: Get a single subaccount (with balances) for current broker
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubaccountResponse'
      operationId: brokerageSubaccountsGet
      x-wb-resource: brokerage.subaccounts
      x-wb-name: get
      x-wb-source: openapi
      x-wb-first-seen: '2026-11-07'
  /api/v1/brokerage/subaccount/{id}/details:
    get:
      summary: Get Subaccount Details
      description: Get CRM details for a subaccount
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubaccountDetailsResponse'
      operationId: brokerageSubaccountsDetails
      x-wb-resource: brokerage.subaccounts
      x-wb-name: details
      x-wb-source: openapi
      x-wb-first-seen: '2026-11-07'
components:
  schemas:
    AssetFilter:
      type: object
      properties:
        fromAsset:
          type: string
          description: Source asset for OTC exchange (use together with toAsset)
        toAsset:
          type: string
          description: Target asset for OTC exchange (use together with fromAsset)
        asset:
          type: string
          description: Single asset for Balance orders (DEPOSIT/WITHDRAWAL)
      description: Asset filters. For OTC orders specify both fromAsset and toAsset. For Balance orders
        specify asset (single-asset).
    BalanceOrderFilterRequest:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/BalanceOrderStatus'
        creationDateFrame:
          $ref: '#/components/schemas/DateFrame'
        completionDateFrame:
          $ref: '#/components/schemas/DateFrame'
        brokerId:
          type: string
          description: Broker ID to filter by. If the requester is Broker, this value will be ignored
            and overridden with the current broker's ID.
          format: uuid
        subaccountId:
          type: string
          format: uuid
        assetCode:
          type: string
        amount:
          type: number
    BalanceOrderResponse:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
        subaccountId:
          type: string
          format: uuid
        subaccountCustomId:
          type: string
        status:
          $ref: '#/components/schemas/BalanceOrderStatus'
        assetType:
          type: string
          enum:
          - FIAT
          - CRYPTO
        assetCode:
          type: string
        assetNetwork:
          type: string
        direction:
          type: string
          enum:
          - DEPOSIT
          - WITHDRAWAL
        providerType:
          $ref: '#/components/schemas/ProviderType'
        internalToken:
          type: string
        amount:
          type: number
        toCryptoAddressId:
          type: string
          format: uuid
        toCryptoAddress:
          type: string
        depositAddress:
          type: string
        cryptoWithdrawalCalculation:
          $ref: '#/components/schemas/CryptoWithdrawalCalculation'
        expirationDate:
          type: string
          format: date-time
        completionDate:
          type: string
          format: date-time
        paymentLink:
          type: string
    BalanceOrderStatus:
      type: string
      enum:
      - ARREST
      - AWAITING_ADMIN_CONFIRMATION
      - AWAITING_CLIENT_CONFIRMATION
      - COMPLETED
      - CONFIRMATION_EXPIRED
      - DECLINED
      - PENDING
    ClientCryptoWithdrawalTokenRequest:
      required:
      - token
      type: object
      properties:
        token:
          type: string
    CryptoAddressRequest:
      required:
      - address
      - network
      type: object
      properties:
        address:
          type: string
        network:
          $ref: '#/components/schemas/Network'
    CryptoAddressResponse:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
        address:
          type: string
        network:
          $ref: '#/components/schemas/Network'
        status:
          type: string
          enum:
          - PENDING
          - ACTIVE
          - BLOCKED
    CryptoDepositCancelRequest:
      required:
      - balanceOrderId
      type: object
      properties:
        balanceOrderId:
          type: string
          format: uuid
    CryptoDepositRequest:
      required:
      - amount
      - assetCode
      - assetNetwork
      - subaccountId
      type: object
      properties:
        subaccountId:
          type: string
          format: uuid
        assetCode:
          type: string
        assetNetwork:
          $ref: '#/components/schemas/Network'
        amount:
          exclusiveMinimum: 0
          type: number
    CryptoWithdrawalCalculation:
      type: object
      properties:
        commissionAmount:
          type: number
        receivedAmount:
          type: number
        expirationDate:
          type: string
          format: date-time
    CryptoWithdrawalRequest:
      required:
      - amount
      - assetCode
      - assetNetwork
      - subaccountId
      - toCryptoAddressId
      type: object
      properties:
        subaccountId:
          type: string
          format: uuid
        toCryptoAddressId:
          type: string
          format: uuid
        comment:
          type: string
        assetCode:
          type: string
        assetNetwork:
          $ref: '#/components/schemas/Network'
        amount:
          exclusiveMinimum: 0
          type: number
    DateFrame:
      type: object
      properties:
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
    DownloadTokenResponse:
      type: object
      properties:
        token:
          type: string
    FiatDepositRequest:
      required:
      - amount
      - assetCode
      - fiatProviderType
      - subaccountId
      type: object
      properties:
        subaccountId:
          type: string
          format: uuid

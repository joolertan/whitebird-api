openapi: 3.1.0
info:
  title: Accounting API (gateway)
  version: '1'
  description: |
    Ledger accounts (wallet balances per account type), ledger transactions and receipts served
    by the API gateway under `/api/v2/accounting`. Reconstructed from the whitebird.io web app.
x-wb-service: api
servers:
- url: https://api.whitebird.io
paths:
  /api/v2/accounting/client/account:
    post:
      operationId: accountingAccountsGet
      x-wb-resource: accounting.accounts
      x-wb-name: get
      x-wb-status: experimental
      x-wb-source: bundle
      summary: Get balances of a ledger account
      description: |
        Balances of one account type (`USER_BALANCE` = Whitebird wallet, `REFERRER_BALANCE` =
        referral rewards, `ICO_BALANCE` = digital-token account, ...), optionally restricted to
        some assets.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountingAccountRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountingAccount'
  /api/v2/accounting/client/transactions:
    post:
      operationId: accountingTransactionsList
      x-wb-resource: accounting.transactions
      x-wb-name: list
      x-wb-status: experimental
      x-wb-source: bundle
      summary: List ledger transactions
      description: |
        The web app uses it for referral accruals:
        `{"transactionTypes": ["REFERRER_FEE"], "accountType": "REFERRER_BALANCE"}`.
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      - $ref: '#/components/parameters/Sort'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountingTransactionFilter'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountingTransactionPage'
  /api/v2/accounting/download:
    get:
      operationId: accountingTransactionsDownloadReceipt
      x-wb-resource: accounting.transactions
      x-wb-name: download_receipt
      x-wb-response: binary
      x-wb-status: experimental
      x-wb-source: bundle
      summary: Download a transaction receipt
      description: PDF receipt of a digital-token (ICO) purchase or income payment.
      parameters:
      - name: txId
        in: query
        required: true
        description: External transaction id (`txId` of an ICO purchase, `externalId` of an ICO operation).
        schema:
          type: string
      responses:
        '200':
          description: PDF document
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
  /api/v2/accounting/email/download:
    get:
      operationId: accountingTransactionsEmailReceipt
      x-wb-resource: accounting.transactions
      x-wb-name: email_receipt
      x-wb-response: empty
      x-wb-status: experimental
      x-wb-source: bundle
      summary: Email a transaction receipt
      description: Variant of `download_receipt` used by the mobile app; the receipt is sent to the client's e-mail.
      parameters:
      - name: txId
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
  /api/v2/accounting/referrer/transactions:
    post:
      operationId: referralTransactionsList
      x-wb-resource: referral.transactions
      x-wb-name: list
      x-wb-status: experimental
      x-wb-source: bundle
      summary: List referral balance withdrawals
      description: Transfers from the referral balance to the wallet (see `referral.withdraw`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReferralTransactionsRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferralTransactionPage'
components:
  parameters:
    Page:
      name: page
      in: query
      description: Zero-based page index.
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      description: Page size.
      schema:
        type: integer
        minimum: 1
        default: 20
    Sort:
      name: sort
      in: query
      description: Sort criteria in the format `property,(asc|desc)`.
      schema:
        type: string
        default: creationDate,desc
  schemas:
    AccountingAccountType:
      type: string
      enum: [USER_BALANCE, USER_PAYMENT, USER_EXCHANGE, USER_FEES, USER_PAYMENT_RESERVING,
        USER_SPOT_RESERVING, REFERRER_BALANCE, ICO_BALANCE]
    AccountingAccountRequest:
      type: object
      required: [type]
      properties:
        type:
          $ref: '#/components/schemas/AccountingAccountType'
        assets:
          type: [array, 'null']
          description: Asset codes to include; all assets when null.
          items:
            type: string
    AccountingBalance:
      type: object
      properties:
        currency:
          type: string
          x-wb-inferred: true
        amount:
          type: number
          format: decimal
          x-wb-inferred: true
        type:
          $ref: '#/components/schemas/AccountingAccountType'
          x-wb-inferred: true
        network:
          type: string
          description: Network of e-money assets.
          x-wb-inferred: true
    AccountingAccount:
      type: object
      properties:
        balances:
          type: array
          items:
            $ref: '#/components/schemas/AccountingBalance'
          x-wb-inferred: true
    AccountingTransactionType:
      type: string
      description: Only `REFERRER_FEE` is seen in the web app.
      enum: [REFERRER_FEE]
    AccountingTransactionFilter:
      type: object
      properties:
        transactionTypes:
          type: array
          items:
            $ref: '#/components/schemas/AccountingTransactionType'
        accountType:
          $ref: '#/components/schemas/AccountingAccountType'
    AccountingTransactionDetails:
      type: object
      properties:
        refereeEmail:
          type: string
          x-wb-inferred: true
    AccountingTransaction:
      type: object
      properties:
        id:
          description: Row id (type not visible in the web app).
          x-wb-inferred: true
        externalTxId:
          type: string
          x-wb-inferred: true
        referralId:
          type: string
          description: Id of the referred user (referral accruals).
          x-wb-inferred: true
        amount:
          type: number
          format: decimal
          x-wb-inferred: true
        currency:
          type: string
          x-wb-inferred: true
        createdTimestamp:
          type: string
          format: date-time
          x-wb-inferred: true
        details:
          $ref: '#/components/schemas/AccountingTransactionDetails'
          x-wb-inferred: true
    AccountingTransactionPage:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/AccountingTransaction'
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
        number:
          type: integer
        size:
          type: integer
        first:
          type: boolean
        last:
          type: boolean
        empty:
          type: boolean
    ReferralTransactionsRequest:
      type: object
      properties:
        page:
          type: integer
          minimum: 0
          default: 0
          description: Zero-based page index.
        size:
          type: integer
          minimum: 1
          default: 20
    ReferralTransaction:
      type: object
      properties:
        id:
          description: Row id (type not visible in the web app).
          x-wb-inferred: true
        externalTxId:
          type: string
          x-wb-inferred: true
        amount:
          type: number
          format: decimal
          description: Negative for withdrawals from the referral balance.
          x-wb-inferred: true
        currency:
          type: string
          x-wb-inferred: true
        createdTimestamp:
          type: string
          format: date-time
          x-wb-inferred: true
    ReferralTransactionPage:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/ReferralTransaction'
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
        number:
          type: integer
        size:
          type: integer
        first:
          type: boolean
        last:
          type: boolean
        empty:
          type: boolean

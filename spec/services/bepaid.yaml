openapi: 3.1.0
info:
  title: bePaid payments API
  version: '1'
  description: |
    Reconstructed from the whitebird.io web application (build By9aTaK4).

    bePaid is a Belarusian card payment gateway formerly used to bind cards (provider type
    `BEPAID`). The current web app binds Belarusian cards through Alfa-Bank and Assist and only
    references this service from unused legacy code.
x-wb-service: bepaid
servers:
- url: https://bepaid-service.whitebird.io
paths:
  /api/v1/card/bind/url:
    get:
      operationId: providersBepaidCardBindUrl
      x-wb-resource: providers.bepaid
      x-wb-name: card_bind_url
      x-wb-status: experimental
      x-wb-source: bundle
      x-wb-first-seen: '2026-11-07'
      summary: Get a bePaid card binding URL
      description: |
        Legacy: the current web app never reads the response. Like the other binding endpoints it
        presumably returns the URL of the bePaid page where the user enters the card details and
        passes 3-D Secure in a browser before being sent back to `returnUrl`.
      parameters:
      - name: returnUrl
        in: query
        required: true
        description: Where bePaid sends the browser after the binding.
        schema: {type: string, format: uri}
      responses:
        '200':
          description: OK
          content:
            application/json: {}

# Calls the web app makes that the SDKs deliberately leave out. `wbscan diff` does not report
# them as new. Each entry maps to the reason.
hosts:
  admin-service.whitebird.io: Marketing attribution of visits (audit records) and the e-mailed transfer approval page.
  wb-exchange-proxy.onrender.com: Market info proxy of the trading terminal, hosted outside whitebird.io.
endpoints:
  GET https://notification-service.whitebird.io/api/v1/wb-ws: SockJS/STOMP push of new bell-menu events; the SDKs use the SSE stream (/api/v1/sse/connect).

version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - godot
    - intrange
    - misspell
    - nilerr
    - noctx
    - perfsprint
    - revive
    - unconvert
    - unparam
    - usestdlibvars
    - whitespace
  settings:
    godot:
      scope: declarations
    misspell:
      locale: US
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: var-naming
        - name: receiver-naming
        - name: indent-error-flow
        - name: error-strings
        - name: error-naming
        - name: errorf
        - name: context-as-argument
        - name: unused-parameter
        - name: unexported-return
  exclusions:
    generated: strict
    presets:
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - bodyclose
          - errcheck
          - noctx
      # Examples end with log.Fatal on errors, as readers expect.
      - path: example_test\.go
        text: exitAfterDefer

formatters:
  enable:
    - gofmt
    - goimports

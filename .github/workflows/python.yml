name: Python

on:
  push:
    branches: [main]
    paths: [python/**, examples/python/**, .github/workflows/python.yml]
  pull_request:
    paths: [python/**, examples/python/**, .github/workflows/python.yml]

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: python/uv.lock
      - run: uv sync --all-extras --locked
      - run: uv run ruff check . ../examples/python
      - run: uv run ruff format --check . ../examples/python
      - run: uv run mypy
      - run: uv run pytest

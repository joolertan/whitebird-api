name: Node.js

on:
  push:
    branches: [main]
    paths: [node/**, examples/node/**, .github/workflows/node.yml]
  pull_request:
    paths: [node/**, examples/node/**, .github/workflows/node.yml]

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            node/package-lock.json
            examples/node/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: Typecheck the examples
        working-directory: examples/node
        run: npm ci && npm run typecheck

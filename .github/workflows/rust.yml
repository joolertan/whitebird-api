name: Rust

on:
  push:
    branches: [main]
    paths: [rust/**, examples/rust/**, .github/workflows/rust.yml]
  pull_request:
    paths: [rust/**, examples/rust/**, .github/workflows/rust.yml]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: Rust ${{ matrix.rust }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust: ["1.85", stable]
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust
            examples/rust
      - run: cargo test --all-features --locked
      - run: cargo test --locked
      # Not --locked: a release bumps the SDK version, which the examples' lock file records.
      - run: cargo check --all-targets
        working-directory: examples/rust

  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust
            examples/rust
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features --locked
      - run: cargo clippy --all-targets --no-default-features --features native-tls,blocking --locked
      - run: cargo doc --all-features --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Examples
        working-directory: examples/rust
        run: |
          cargo fmt --check
          cargo clippy --all-targets

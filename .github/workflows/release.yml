name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      python: ${{ steps.release.outputs['python--release_created'] }}
      node: ${{ steps.release.outputs['node--release_created'] }}
      go: ${{ steps.release.outputs['go--release_created'] }}
      go-tag: ${{ steps.release.outputs['go--tag_name'] }}
      rust: ${{ steps.release.outputs['rust--release_created'] }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  pypi:
    needs: release-please
    if: needs.release-please.outputs.python == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/whitebird-api/
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv build
        working-directory: python
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist

  npm:
    needs: release-please
    if: needs.release-please.outputs.node == 'true'
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/whitebird-api
    permissions:
      id-token: write
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      # Trusted publishing: npm exchanges the workflow's OIDC token, no NPM_TOKEN is needed.
      - run: npm publish --provenance --access public

  crates-io:
    needs: release-please
    if: needs.release-please.outputs.rust == 'true'
    runs-on: ubuntu-latest
    environment:
      name: crates-io
      url: https://crates.io/crates/whitebird-api
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - run: cargo publish --locked
        working-directory: rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  go-proxy:
    needs: release-please
    if: needs.release-please.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      # The tag is the release; asking the proxy for it makes pkg.go.dev pick it up.
      - run: curl -fsS "https://proxy.golang.org/github.com/joolertan/whitebird-api/go/@v/${TAG#go/}.info"
        env:
          TAG: ${{ needs.release-please.outputs.go-tag }}

name: Release

# release-please keeps one release pull request for the whole project: one version, one changelog.
# Merging it creates the release tag vX.Y.Z and publishes every package.
on:
  push:
    branches: [main]

permissions:
  contents: read

# Pushes in quick succession must not run release-please concurrently: the runs would race to
# create the same labels and tags.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write # labels belong to the issues API
      pull-requests: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  pypi:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/whitebird-api/
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv build
        working-directory: python
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist

  npm:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/whitebird-api
    permissions:
      id-token: write
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      # Trusted publishing: npm exchanges the workflow's OIDC token, no NPM_TOKEN is needed.
      - run: npm publish --provenance --access public

  crates-io:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-latest
    environment:
      name: crates-io
      url: https://crates.io/crates/whitebird-api
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - run: cargo publish --locked
        working-directory: rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  go-proxy:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.release-please.outputs.tag }}
      SHA: ${{ needs.release-please.outputs.sha }}
    steps:
      # The Go module lives in go/, so the go command only sees versions tagged go/vX.Y.Z.
      # The tag is created once; a re-run finds it and goes on.
      - run: |
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/go/$TAG" --silent ||
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/go/$TAG" -f sha="$SHA"
      # Asking the proxy for the version makes pkg.go.dev pick it up.
      - run: curl -fsS "https://proxy.golang.org/github.com/joolertan/whitebird-api/go/@v/$TAG.info"

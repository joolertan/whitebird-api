site_name: Whitebird API
site_description: Unofficial Python, Node.js, Go and Rust clients for the Whitebird exchange API
site_url: https://whitebird-api.readthedocs.io/
repo_url: https://github.com/joolertan/whitebird-api
repo_name: joolertan/whitebird-api
edit_uri: edit/main/docs/
copyright: MIT License · Not affiliated with Whitebird

theme:
  name: material
  language: en
  icon:
    logo: material/bird
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [python/src]
          options:
            docstring_style: google
            filters: ["!^_"]
            members_order: source
            merge_init_into_class: true
            separate_signature: true
            show_root_heading: true
            show_signature_annotations: true
            show_source: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            signature_crossrefs: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: [.]
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Guides:
      - guides/authentication.md
      - guides/environments.md
      - guides/pagination.md
      - guides/errors.md
      - guides/streaming.md
      - guides/raw-requests.md
      - guides/api-changes.md
  - Examples: examples.md
  - Reference:
      - reference/endpoints.md
      - Python: reference/python.md
      - Node.js: reference/node.md
      - Go: reference/go.md
      - Rust: reference/rust.md
  - Development:
      - development/architecture.md
      - development/contributing.md
      - development/publishing.md

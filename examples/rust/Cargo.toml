[package]
name = "whitebird-examples"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
publish = false
description = "Examples for the whitebird-api crate"
license = "MIT"

[dependencies]
base64 = "0.22"
futures = "0.3"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
whitebird-api = { path = "../../rust", features = ["otp"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

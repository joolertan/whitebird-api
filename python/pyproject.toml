[project]
name = "whitebird-api"
dynamic = ["version"]
description = "Unofficial Whitebird API client"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["whitebird", "crypto", "cryptocurrency", "exchange", "trading", "api", "client", "sdk"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.27", "pydantic>=2.11", "typing-extensions>=4.12"]

[project.optional-dependencies]
otp = ["pyotp>=2.9"]

[project.urls]
Homepage = "https://github.com/joolertan/whitebird-api"
Repository = "https://github.com/joolertan/whitebird-api"
Documentation = "https://whitebird-api.readthedocs.io"
Issues = "https://github.com/joolertan/whitebird-api/issues"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pyotp>=2.9",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff==0.17.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/whitebird/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/whitebird"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "D", "N", "PT", "PL", "C4", "PIE", "RET"]
ignore = ["D105", "D107", "PLR0911", "PLR0913", "PLR2004"]

[tool.ruff.lint.isort]
known-first-party = ["whitebird"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "PLC0415"]
# API values quoted in docstrings can be Cyrillic.
"src/whitebird/_generated/**" = ["RUF002"]

[tool.mypy]
strict = true
files = ["src", "tests", "../examples/python"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["error"]

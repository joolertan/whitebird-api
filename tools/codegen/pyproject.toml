[project]
name = "whitebird-codegen"
version = "0.1.0"
description = "Generates the Whitebird SDKs from spec/"
requires-python = ">=3.11"
dependencies = ["jinja2>=3.1", "pyyaml>=6.0"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8", "mypy>=1.13", "types-pyyaml"]

[project.scripts]
whitebird-codegen = "whitebird_codegen.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
